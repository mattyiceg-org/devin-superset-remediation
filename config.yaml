# Non-secret configuration. Secrets (API keys/tokens) live in .env instead.

github:
  owner: mattyiceg-org
  repo: superset
  label: devin-fix       # issues carrying this label are picked up by the scanner

scan:
  interval_minutes: 5
  max_concurrent_sessions: 2   # cap on simultaneously "working" Devin sessions

devin:
  org_id: "org-f304637925c84c04ac7771f8e58c3d3c"
  playbook_id: "playbook-c8dd394f548a4f06aca0218ed08a3cbb"   # "Superset Issue Remediation"

storage:
  db_path: "data/remediations.db"   # mounted as a Docker volume so state survives restarts
